# Umbriel configuration
#
# Managed in dot-nix and installed by nixidite via programs.umbriel.settings.
# Most changes apply when the file is saved. Check edits with
# `umbriel config validate`.
#
# Theme colors are generated by nixidite (den.aspects.theme) into
# ~/.config/umbriel/theme.toml and pulled in by the optional include below.
# Do not define [colors*] tables in this file: the including file is applied
# last, so a local color would override the generated theme.

# ==============================================================================
# Includes

[include]
files = []

# Optional so a missing theme file never blocks startup. theme-switch creates
# it on first activation and flips it on every theme change.
[include.optional]
files = ["~/.config/umbriel/theme.toml"]

# ==============================================================================
# General

[general]
autostart = ["noctalia"]
show_cheatsheet = false
nvidia_sync_workaround = true

# ==============================================================================
# Outputs
# Machine specific: run `umbriel outputs` if the connector changes.

[output.eDP-1]
mode = "1920x1080@60"
position = [0, 0]
scale = 1

# ==============================================================================
# Appearance

[appearance]
border_width = 2
corner_radius = 3

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 6

# ==============================================================================
# Input

[input.keyboard]
layout = "us,graphite"
variant = ","
numlock_toggle = true

[input.touchpad]
disable_while_typing = true

# ==============================================================================
# Keybinds
# Mirrors the current Hyprland binds. Defining this table replaces the built-in
# bind set, so every active bind that should remain available is listed here.

[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+Shift+Return" = { action = "spawn ghostty", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+C" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+W" = { action = "window-close", repeat = false }
"Mod+Shift+W" = "session-quit"
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness keys, routed through the Noctalia shell.
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Z" = "window-focus-up"
"Mod+X" = "window-focus-down"
"Mod+Q" = "window-focus-left"
"Mod+E" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Tab" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Q" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+E" = "column-move-right"

# Window state and layout
"Mod+S" = { action = "window-toggle-floating", repeat = false }
"Mod+T" = { action = "window-toggle-pinned", repeat = false }
# Screenshots (grim + slurp via the shared dot-nix helper)
"Mod+P" = { action = "spawn screenshot full", repeat = false }
"Mod+Shift+P" = { action = "spawn screenshot area", repeat = false }
"Mod+Alt+P" = { action = "spawn screenshot window", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
# Tab group toggle, equivalent to Hyprland's SUPER+G group toggle
"Mod+G" = { action = "column-toggle-tabbed", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Ctrl+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Ctrl+Equal" = "window-modify-secondary-extent +0.02"
"Mod+BracketLeft" = "window-consume-left"
"Mod+BracketRight" = "window-consume-right"
"Mod+Ctrl+BracketLeft" = "window-consume-from-left"
"Mod+Ctrl+BracketRight" = "window-consume-from-right"
"Mod+Shift+BracketLeft" = "column-move-left"
"Mod+Shift+BracketRight" = "column-move-right"
"Mod+Comma" = "column-focus-tab-previous"
"Mod+Period" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }
# Layout toggle: master (default) <-> scrolling for the active workspace
"Mod+Shift+O" = "workspace-set-layout toggle master scrolling"

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+0" = "workspace-switch 10"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Shift+0" = "window-move-to-workspace 10"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+V" = "scratchpad-toggle"
"Mod+Shift+V" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }

# ==============================================================================
# Layout

[layout]
mode = "master"
extent_presets = [0.333, 0.5, 0.667]

# Match the current Hyprland master behavior: new windows become master.
[layout.master]
new_becomes_master = true

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Window rules

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview and hot corners

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
